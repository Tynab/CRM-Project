server.port=${PORT:8080}

# Tom tat: Cau hinh ket noi MySQL. Cac bien CRM_DATASOURCE_* giup chay an
# toan hon tren local, Docker, Jenkins hoac Heroku ma khong hard-code mat khau.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${CRM_DATASOURCE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${CRM_DATASOURCE_USERNAME:root}
spring.datasource.password=${CRM_DATASOURCE_PASSWORD:}

# Tom tat: JPA mac dinh update schema de phu hop bai tap/demo, co the override
# bang bien moi truong khi len production.
spring.jpa.show-sql=${CRM_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${CRM_JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB
server.servlet.session.tracking-modes=cookie
